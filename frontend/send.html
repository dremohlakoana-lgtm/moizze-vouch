<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send Vouch — Moizze</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="app-container">
  <!-- Sidebar (same as dashboard) -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-text">Moizze</div>
      <div class="sidebar-logo-sub">Vouch Banking</div>
    </div>
    <div class="sidebar-nav">
      <div class="nav-section-label">Main</div>
      <a href="/dashboard.html" class="nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>Dashboard</a>
      <a href="/send.html" class="nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>Send Vouch</a>
      <a href="/deposit.html" class="nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/></svg>Buy Vouch</a>
      <a href="/withdraw.html" class="nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>Withdraw</a>
      <a href="/transactions.html" class="nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>Transactions</a>
      <div class="nav-section-label" style="margin-top:12px">Account</div>
      <a href="/profile.html" class="nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>Profile</a>
      <a href="#" class="nav-item" data-action="logout"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>Sign Out</a>
    </div>
    <div class="sidebar-footer">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="avatar" id="headerAvatar">?</div>
        <div>
          <div style="font-size:14px;font-weight:600;color:var(--text)" id="headerUserName">Loading...</div>
          <div style="font-size:12px;color:var(--text-dim)" id="headerRole"></div>
        </div>
      </div>
    </div>
  </nav>

  <main class="main-content">
    <div class="top-bar">
      <div class="top-bar-left">
        <button class="menu-toggle" id="menuToggle">
          <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div>
          <div class="page-title">Send Vouch</div>
          <div class="page-subtitle">Transfer Vouch to another user</div>
        </div>
      </div>
    </div>

    <div style="max-width:520px">
      <!-- Balance display -->
      <div class="card mb-24" style="background:linear-gradient(135deg,var(--secondary),var(--accent));border:none">
        <div style="font-size:13px;color:rgba(255,255,255,0.7);margin-bottom:4px">Available Balance</div>
        <div style="font-size:32px;font-weight:800;color:white" id="displayBalance">Loading...</div>
      </div>

      <div class="card">
        <div class="card-title mb-24">Send Vouch</div>
        <form id="sendForm">
          <div class="form-group">
            <label class="form-label">Receiver Account Number</label>
            <input type="text" id="receiverAccount" class="form-control font-mono" placeholder="0000000000" maxlength="10" required pattern="[0-9]{10}">
            <div style="font-size:12px;color:var(--text-dim);margin-top:6px">Enter 10-digit Moizze account number</div>
          </div>
          <div class="form-group">
            <label class="form-label">Amount (Vouch)</label>
            <div style="position:relative">
              <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--accent)">V</span>
              <input type="number" id="sendAmount" class="form-control" style="padding-left:32px" placeholder="0.00" min="0.01" step="0.01" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Description <span style="color:var(--text-dim)">(optional)</span></label>
            <input type="text" id="sendDescription" class="form-control" placeholder="e.g. Payment for services" maxlength="255">
          </div>

          <!-- Confirmation box (hidden until verified) -->
          <div id="confirmBox" class="hidden" style="background:var(--surface-2);border:1px solid var(--accent);border-radius:var(--radius);padding:16px;margin-bottom:20px">
            <div style="font-size:13px;color:var(--text-muted);margin-bottom:8px">Sending to</div>
            <div style="font-size:16px;font-weight:700;color:var(--text)" id="confirmReceiverName">—</div>
            <div style="font-size:13px;color:var(--text-dim)" id="confirmReceiverAcc">—</div>
            <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);display:flex;justify-content:space-between">
              <span style="color:var(--text-muted)">Amount</span>
              <span style="font-weight:700;color:var(--accent)" id="confirmAmount">—</span>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-full" id="sendBtn">Send Vouch</button>
        </form>
      </div>
    </div>
  </main>
</div>

<nav class="bottom-nav">
  <div class="bottom-nav-items">
    <a href="/dashboard.html" class="bottom-nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>Home</a>
    <a href="/send.html" class="bottom-nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>Send</a>
    <a href="/deposit.html" class="bottom-nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/></svg>Buy</a>
    <a href="/transactions.html" class="bottom-nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>History</a>
    <a href="/profile.html" class="bottom-nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>Profile</a>
  </div>
</nav>

<script src="/js/app.js"></script>
<script src="/js/send.js"></script>
</body>
</html>
