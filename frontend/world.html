<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Moizze World — Weekly Intelligence</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    .world-hero {
      text-align: center;
      padding: 60px 20px 40px;
      background: radial-gradient(ellipse at center, #1a1a2e 0%, var(--bg) 70%);
      border-bottom: 1px solid var(--border);
    }
    .world-title {
      font-size: 48px;
      font-weight: 900;
      background: linear-gradient(135deg, #7c6bff, #b89cff, #ff6b9d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }
    .world-sub { color: var(--text-dim); font-size: 16px; margin-bottom: 24px; }
    .week-badge {
      display: inline-block;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 20px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .workers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .worker-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .worker-card:hover { border-color: var(--accent); }
    .worker-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }
    .worker-avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 900;
      flex-shrink: 0;
    }
    .worker-name { font-weight: 800; font-size: 16px; }
    .worker-role { font-size: 12px; color: var(--text-dim); }
    .worker-status {
      margin-left: auto;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }
    .status-working { background: #f59e0b22; color: #f59e0b; }
    .status-done { background: #22c55e22; color: #22c55e; }
    .status-idle { background: var(--surface-2); color: var(--text-dim); }
    .worker-body { padding: 16px 20px; }
    .result-item {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      line-height: 1.5;
    }
    .result-item:last-child { border-bottom: none; }
    .result-title { font-weight: 700; color: var(--text); margin-bottom: 2px; }
    .result-detail { color: var(--text-muted); font-size: 12px; }
    .empty-worker { color: var(--text-dim); font-size: 13px; text-align: center; padding: 24px 0; }
    .boss-bar {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 8px;
    }
    .boss-avatar {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, #7c6bff, #b89cff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .boss-info h2 { font-size: 18px; font-weight: 800; }
    .boss-info p { font-size: 13px; color: var(--text-dim); }
    .refresh-btn {
      margin-left: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

    .colors { --c1:#7c6bff; --c2:#ff6b9d; --c3:#22c55e; --c4:#f59e0b; --c5:#06b6d4; --c6:#ec4899; --c7:#f97316; }
  </style>
</head>
<body class="colors">
<div class="world-hero">
  <div class="world-title">🌍 Moizze World</div>
  <div class="world-sub">7 workers. Every Monday. Real South African intelligence.</div>
  <div class="week-badge" id="weekBadge">Loading...</div>
</div>

<div style="max-width:1200px;margin:32px auto;padding:0 20px">
  <div class="boss-bar">
    <div class="boss-avatar">👑</div>
    <div class="boss-info">
      <h2>The Boss</h2>
      <p id="bossStatus">Deploys 7 workers every Monday at 6:00 AM SA time</p>
    </div>
    <button class="refresh-btn" onclick="loadReport()">↻ Refresh</button>
  </div>
</div>

<div class="workers-grid" id="workersGrid">
  <!-- Workers rendered here -->
</div>

<script>
const WORKERS_META = [
  { id: 1, name: 'Scout',  role: 'SA Business Leads',           emoji: '🔍', color: 'var(--c1)', key: 'scout'  },
  { id: 2, name: 'Pulse',  role: 'Trending Products in SA',     emoji: '📈', color: 'var(--c2)', key: 'pulse'  },
  { id: 3, name: 'Radar',  role: 'SA Job Market Demand',        emoji: '📡', color: 'var(--c3)', key: 'radar'  },
  { id: 4, name: 'Hawk',   role: 'Competitor Prices & Gaps',    emoji: '🦅', color: 'var(--c4)', key: 'hawk'   },
  { id: 5, name: 'Echo',   role: 'SA News & Business Events',   emoji: '📰', color: 'var(--c5)', key: 'echo'   },
  { id: 6, name: 'Vibe',   role: 'Social Trends & Viral SA',    emoji: '🔥', color: 'var(--c6)', key: 'vibe'   },
  { id: 7, name: 'Hunter', role: 'Tenders, Grants & Opps',      emoji: '💰', color: 'var(--c7)', key: 'hunter' },
];

async function loadReport() {
  try {
    const res = await fetch('/world/report-latest.json?t=' + Date.now());
    const report = res.ok ? await res.json() : null;

    const weekBadge = document.getElementById('weekBadge');
    if (report && report.week) {
      weekBadge.textContent = `Week ${report.week} — Last updated ${new Date(report.generated).toLocaleDateString('en-ZA', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' })}`;
    } else {
      weekBadge.textContent = 'Waiting for first Monday run...';
    }

    renderWorkers(report);
  } catch (e) {
    renderWorkers(null);
  }
}

function renderWorkers(report) {
  const grid = document.getElementById('workersGrid');
  grid.innerHTML = WORKERS_META.map(w => {
    const data = report && report[w.key] ? report[w.key] : null;
    const status = data ? 'done' : 'idle';

    const items = data && Array.isArray(data) ? data.map(item => `
      <div class="result-item">
        <div class="result-title">${escapeHtml(item.title || item.name || item.headline || item.topic || item.product || JSON.stringify(item).slice(0,60))}</div>
        <div class="result-detail">${escapeHtml(item.detail || item.summary || item.description || item.location || item.reason || '')}</div>
      </div>
    `).join('') : `<div class="empty-worker">⏳ Worker ${w.name} hasn't reported yet.<br>Results appear every Monday.</div>`;

    return `
      <div class="worker-card">
        <div class="worker-header">
          <div class="worker-avatar" style="background:${w.color}22;color:${w.color}">${w.emoji}</div>
          <div>
            <div class="worker-name">${w.name}</div>
            <div class="worker-role">${w.role}</div>
          </div>
          <div class="worker-status status-${status}">${status === 'done' ? '✅ Done' : '⏳ Idle'}</div>
        </div>
        <div class="worker-body">${items}</div>
      </div>
    `;
  }).join('');
}

document.addEventListener('DOMContentLoaded', loadReport);
</script>
</body>
</html>
