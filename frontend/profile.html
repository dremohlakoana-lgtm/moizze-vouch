<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — Moizze</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="app-container">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo"><div class="sidebar-logo-text">Moizze</div><div class="sidebar-logo-sub">Vouch Banking</div></div>
    <div class="sidebar-nav">
      <div class="nav-section-label">Main</div>
      <a href="/dashboard.html" class="nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>Dashboard</a>
      <a href="/send.html" class="nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>Send Vouch</a>
      <a href="/deposit.html" class="nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/></svg>Buy Vouch</a>
      <a href="/withdraw.html" class="nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>Withdraw</a>
      <a href="/transactions.html" class="nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>Transactions</a>
      <div class="nav-section-label" style="margin-top:12px">Account</div>
      <a href="/profile.html" class="nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>Profile</a>
      <a href="#" class="nav-item" data-action="logout"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>Sign Out</a>
    </div>
    <div class="sidebar-footer"><div style="display:flex;align-items:center;gap:10px"><div class="avatar" id="headerAvatar">?</div><div><div style="font-size:14px;font-weight:600;color:var(--text)" id="headerUserName">Loading...</div><div style="font-size:12px;color:var(--text-dim)" id="headerRole"></div></div></div></div>
  </nav>

  <main class="main-content">
    <div class="top-bar">
      <div class="top-bar-left">
        <button class="menu-toggle" id="menuToggle"><svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <div><div class="page-title">My Profile</div><div class="page-subtitle">Account information and settings</div></div>
      </div>
    </div>

    <div style="max-width:600px">
      <div class="card mb-24" id="profileCard">
        <div class="loading-spinner"><div class="spinner"></div></div>
      </div>

      <!-- Account Details -->
      <div class="card mb-24">
        <div class="card-title mb-16">Account Details</div>
        <div id="accountDetails">
          <div class="loading-spinner"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- Danger zone -->
      <div class="card" style="border-color:rgba(231,76,60,0.3)">
        <div class="card-title mb-16" style="color:var(--red)">Account Actions</div>
        <button class="btn btn-danger btn-sm" data-action="logout">
          Sign Out of Moizze
        </button>
      </div>
    </div>
  </main>
</div>

<nav class="bottom-nav">
  <div class="bottom-nav-items">
    <a href="/dashboard.html" class="bottom-nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>Home</a>
    <a href="/send.html" class="bottom-nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>Send</a>
    <a href="/deposit.html" class="bottom-nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/></svg>Buy</a>
    <a href="/transactions.html" class="bottom-nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>History</a>
    <a href="/profile.html" class="bottom-nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>Profile</a>
  </div>
</nav>

<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const res = await api.get('/auth/me');
  if (!res || !res.success) return;

  const user = res.user;
  Auth.setSession(Auth.getToken(), user); // Refresh cached user

  const profileCard = document.getElementById('profileCard');
  profileCard.innerHTML = `
    <div class="profile-header">
      <div class="profile-avatar">${getInitials(user.full_name)}</div>
      <div>
        <div style="font-size:22px;font-weight:800;color:var(--text)">${escapeHtml(user.full_name)}</div>
        <div style="font-size:14px;color:var(--text-muted)">${escapeHtml(user.email)}</div>
        <div style="margin-top:8px">
          <span class="badge ${user.role === 'admin' ? 'badge-info' : 'badge-success'}">${user.role === 'admin' ? '👑 Admin' : '✓ Verified'}</span>
          ${user.is_active ? '<span class="badge badge-success" style="margin-left:6px">Active</span>' : '<span class="badge badge-danger" style="margin-left:6px">Inactive</span>'}
        </div>
      </div>
    </div>
    <div style="padding:20px;background:var(--surface-2);border-radius:var(--radius);text-align:center">
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:4px">Vouch Balance</div>
      <div style="font-size:36px;font-weight:900;color:var(--accent)">${formatVouch(user.vouch_balance)}</div>
    </div>`;

  const accountDetails = document.getElementById('accountDetails');
  accountDetails.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:16px">
      ${[
        ['Account Number', `<span class="font-mono" style="font-size:18px;color:var(--accent)">${user.account_number}</span>`],
        ['Full Name', escapeHtml(user.full_name)],
        ['Email', escapeHtml(user.email)],
        ['Phone', user.phone ? escapeHtml(user.phone) : '<span style="color:var(--text-dim)">Not set</span>'],
        ['Member Since', formatDate(user.created_at)],
        ['Account Status', user.is_active ? '<span style="color:var(--green)">● Active</span>' : '<span style="color:var(--red)">● Inactive</span>'],
      ].map(([label, value]) => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)">
          <div style="font-size:13px;color:var(--text-muted);font-weight:600">${label}</div>
          <div style="font-size:14px;font-weight:600;color:var(--text)">${value}</div>
        </div>
      `).join('')}
    </div>
    <div style="margin-top:20px;padding:16px;background:var(--surface-2);border-radius:var(--radius-sm)">
      <div style="font-size:13px;color:var(--text-muted)">📢 Share your account number (<strong style="color:var(--accent)">${user.account_number}</strong>) to receive Vouch from others.</div>
    </div>`;
});
</script>
</body>
</html>
