<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Moizze World — SA Intelligence</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    * { box-sizing: border-box; }
    .world-hero {
      text-align: center;
      padding: 50px 20px 36px;
      background: radial-gradient(ellipse at center, #1a1a2e 0%, var(--bg) 70%);
      border-bottom: 1px solid var(--border);
    }
    .world-title {
      font-size: 44px;
      font-weight: 900;
      background: linear-gradient(135deg, #7c6bff, #b89cff, #ff6b9d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }
    .world-sub { color: var(--text-dim); font-size: 15px; margin-bottom: 20px; }
    .hero-badges { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .hero-badge {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 16px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .hero-badge.green { border-color: #22c55e44; color: #22c55e; background: #22c55e11; }
    .hero-badge.purple { border-color: #7c6bff44; color: #b89cff; background: #7c6bff11; }

    /* ── Forex Bar ─────────────────────────────────── */
    .forex-section {
      max-width: 1200px;
      margin: 32px auto 0;
      padding: 0 20px;
    }
    .forex-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .live-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 1.5s infinite;
      display: inline-block;
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(1.3)} }
    .forex-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 32px;
    }
    .forex-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      text-align: center;
    }
    .forex-pair { font-size: 11px; color: var(--text-dim); font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
    .forex-rate { font-size: 22px; font-weight: 800; color: var(--text); }
    .forex-change { font-size: 11px; font-weight: 700; margin-top: 3px; }
    .up { color: #22c55e; }
    .down { color: #ef4444; }
    .forex-updated { font-size: 11px; color: var(--text-dim); margin-top: 12px; text-align: right; }

    /* ── Boss Bar ──────────────────────────────────── */
    .boss-section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }
    .boss-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }
    .boss-avatar {
      width: 48px; height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, #7c6bff, #b89cff);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .boss-info h2 { font-size: 16px; font-weight: 800; margin-bottom: 2px; }
    .boss-info p { font-size: 12px; color: var(--text-dim); }
    .boss-right { margin-left: auto; text-align: right; }
    .next-run { font-size: 12px; color: var(--text-dim); }
    .countdown { font-size: 16px; font-weight: 800; color: #b89cff; }
    .refresh-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      margin-top: 6px;
      transition: all 0.2s;
    }
    .refresh-btn:hover { border-color: #7c6bff; color: #b89cff; }

    /* ── Workers Grid ──────────────────────────────── */
    .workers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto 60px;
      padding: 0 20px;
    }
    .worker-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: border-color 0.2s, transform 0.2s;
    }
    .worker-card:hover { border-color: #7c6bff55; transform: translateY(-2px); }
    .worker-header {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .worker-avatar {
      width: 40px; height: 40px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .worker-name { font-weight: 800; font-size: 15px; }
    .worker-role { font-size: 11px; color: var(--text-dim); }
    .worker-status {
      margin-left: auto;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }
    .status-done { background: #22c55e22; color: #22c55e; }
    .status-idle { background: #ffffff11; color: var(--text-dim); }
    .worker-body { padding: 14px 16px; }
    .result-item {
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .result-item:last-child { border-bottom: none; }
    .result-title { font-weight: 700; color: var(--text); margin-bottom: 2px; line-height: 1.3; }
    .result-detail { color: var(--text-muted); font-size: 11px; line-height: 1.4; }
    .empty-worker { color: var(--text-dim); font-size: 12px; text-align: center; padding: 20px 0; line-height: 1.6; }

    .section-label {
      font-size: 13px; font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>

<!-- Hero -->
<div class="world-hero">
  <div class="world-title">🌍 Moizze World</div>
  <div class="world-sub">Real South African intelligence. 7 workers. Every Monday.</div>
  <div class="hero-badges">
    <span class="hero-badge green"><span class="live-dot"></span> Live Forex</span>
    <span class="hero-badge purple">👑 Boss runs every Monday 6AM SA</span>
    <span class="hero-badge" id="weekBadge">Loading...</span>
  </div>
</div>

<!-- Forex Section -->
<div class="forex-section">
  <div class="forex-title">
    <span class="live-dot"></span> Live Forex — ZAR Rates
  </div>
  <div class="forex-grid" id="forexGrid">
    <div class="forex-card" style="grid-column:1/-1;text-align:center;color:var(--text-dim);font-size:13px">Loading rates...</div>
  </div>
  <div class="forex-updated" id="forexUpdated"></div>
</div>

<!-- Boss Bar -->
<div class="boss-section">
  <div class="boss-bar">
    <div class="boss-avatar">👑</div>
    <div class="boss-info">
      <h2>The Boss</h2>
      <p id="lastRunText">Checking last run...</p>
    </div>
    <div class="boss-right">
      <div class="next-run">Next run in</div>
      <div class="countdown" id="countdown">--:--:--</div>
      <button class="refresh-btn" onclick="loadReport()">↻ Refresh</button>
    </div>
  </div>

  <div class="section-label">7 Workers — This Week's Report</div>
</div>

<!-- Workers -->
<div class="workers-grid" id="workersGrid"></div>

<script>
function escapeHtml(str) {
  const d = document.createElement('div');
  d.appendChild(document.createTextNode(String(str || '')));
  return d.innerHTML;
}

/* ── Forex ─────────────────────────────────────────── */
const PAIRS = [
  { base: 'USD', label: 'USD/ZAR', flag: '🇺🇸' },
  { base: 'EUR', label: 'EUR/ZAR', flag: '🇪🇺' },
  { base: 'GBP', label: 'GBP/ZAR', flag: '🇬🇧' },
  { base: 'CNY', label: 'CNY/ZAR', flag: '🇨🇳' },
  { base: 'AUD', label: 'AUD/ZAR', flag: '🇦🇺' },
  { base: 'BTC', label: 'BTC/ZAR', flag: '₿'  },
];

async function loadForex() {
  const grid = document.getElementById('forexGrid');
  try {
    // Use frankfurter.app — free, no key needed
    const res = await fetch('https://api.frankfurter.app/latest?from=ZAR&to=USD,EUR,GBP,CNY,AUD');
    const data = await res.json();

    // Invert rates (we want ZAR per foreign unit)
    const rates = {};
    for (const [currency, rate] of Object.entries(data.rates)) {
      rates[currency] = (1 / rate).toFixed(4);
    }

    // BTC price in ZAR via Coinbase
    let btcZar = null;
    try {
      const btcRes = await fetch('https://api.coinbase.com/v2/prices/BTC-ZAR/spot');
      const btcData = await btcRes.json();
      btcZar = parseFloat(btcData.data.amount).toLocaleString('en-ZA', { maximumFractionDigits: 0 });
    } catch(e) {}

    grid.innerHTML = PAIRS.map(p => {
      let rate, display;
      if (p.base === 'BTC') {
        rate = btcZar ? 'R ' + btcZar : '—';
        display = '';
      } else {
        rate = 'R ' + rates[p.base];
        display = '';
      }
      return `
        <div class="forex-card">
          <div class="forex-pair">${p.flag} ${p.label}</div>
          <div class="forex-rate">${rate}</div>
        </div>
      `;
    }).join('');

    document.getElementById('forexUpdated').textContent = 'Updated: ' + new Date().toLocaleTimeString('en-ZA');
  } catch(e) {
    grid.innerHTML = '<div class="forex-card" style="grid-column:1/-1;text-align:center;color:var(--text-dim)">Could not load rates. Try refreshing.</div>';
  }
}

/* ── Countdown to next Monday 6AM SAST ────────────── */
function getNextMonday6AM() {
  const now = new Date();
  // SAST = UTC+2
  const sast = new Date(now.getTime() + (2 * 60 * 60 * 1000));
  const day = sast.getUTCDay(); // 0=Sun, 1=Mon
  const daysUntilMonday = day === 1 ? 7 : (1 - day + 7) % 7 || 7;
  const nextMon = new Date(sast);
  nextMon.setUTCDate(sast.getUTCDate() + daysUntilMonday);
  nextMon.setUTCHours(4, 0, 0, 0); // 6AM SAST = 4AM UTC
  return nextMon;
}

function updateCountdown() {
  const now = new Date();
  const next = getNextMonday6AM();
  const diff = next - now;
  if (diff <= 0) { document.getElementById('countdown').textContent = '🔄 Running now!'; return; }
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  document.getElementById('countdown').textContent =
    (d > 0 ? d + 'd ' : '') + String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

/* ── Workers ───────────────────────────────────────── */
const WORKERS_META = [
  { name:'Scout',  role:'SA Business Leads',        emoji:'🔍', color:'#7c6bff', key:'scout'  },
  { name:'Pulse',  role:'Trending Products in SA',  emoji:'📈', color:'#ff6b9d', key:'pulse'  },
  { name:'Radar',  role:'SA Job Market Demand',     emoji:'📡', color:'#22c55e', key:'radar'  },
  { name:'Hawk',   role:'Competitor Prices & Gaps', emoji:'🦅', color:'#f59e0b', key:'hawk'   },
  { name:'Echo',   role:'SA News & Business Events',emoji:'📰', color:'#06b6d4', key:'echo'   },
  { name:'Vibe',   role:'Social Trends & Viral SA', emoji:'🔥', color:'#ec4899', key:'vibe'   },
  { name:'Hunter', role:'Tenders, Grants & Opps',   emoji:'💰', color:'#f97316', key:'hunter' },
];

async function loadReport() {
  try {
    const res = await fetch('/world/report-latest.json?t=' + Date.now());
    const report = res.ok ? await res.json() : null;

    if (report && report.week) {
      document.getElementById('weekBadge').textContent = '📅 Week ' + report.week;
      document.getElementById('lastRunText').textContent =
        'Last run: ' + new Date(report.generated).toLocaleDateString('en-ZA', { weekday:'long', day:'numeric', month:'short', year:'numeric' });
    } else {
      document.getElementById('weekBadge').textContent = 'Waiting for first run...';
      document.getElementById('lastRunText').textContent = 'Not run yet — first run this Monday 6AM SA';
    }

    renderWorkers(report);
  } catch(e) {
    renderWorkers(null);
  }
}

function renderWorkers(report) {
  const grid = document.getElementById('workersGrid');
  grid.innerHTML = WORKERS_META.map(w => {
    const data = report && report[w.key] ? report[w.key] : null;
    const done = !!data;

    const items = done && Array.isArray(data) ? data.map(item => `
      <div class="result-item">
        <div class="result-title">${escapeHtml(item.title || item.name || item.headline || item.topic || item.product || Object.values(item)[0] || '')}</div>
        <div class="result-detail">${escapeHtml(item.detail || item.summary || item.description || item.reason || item.location || Object.values(item)[1] || '')}</div>
      </div>
    `).join('') : `<div class="empty-worker">⏳ ${w.name} reports every Monday.<br>Check back after 6AM SA time.</div>`;

    return `
      <div class="worker-card">
        <div class="worker-header">
          <div class="worker-avatar" style="background:${w.color}22;color:${w.color}">${w.emoji}</div>
          <div>
            <div class="worker-name">${w.name}</div>
            <div class="worker-role">${w.role}</div>
          </div>
          <span class="worker-status ${done ? 'status-done' : 'status-idle'}">${done ? '✅ Done' : '⏳ Waiting'}</span>
        </div>
        <div class="worker-body">${items}</div>
      </div>
    `;
  }).join('');
}

/* ── Init ──────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {
  loadForex();
  loadReport();
  updateCountdown();
  setInterval(updateCountdown, 1000);
  setInterval(loadForex, 5 * 60 * 1000); // refresh forex every 5 min
});
</script>
</body>
</html>
