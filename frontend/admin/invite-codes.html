<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Invite Codes — Moizze Admin</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    .code-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
    .code-text { font-family:monospace; font-size:18px; font-weight:700; letter-spacing:3px; color:var(--accent); }
    .code-meta { font-size:12px; color:var(--text-dim); margin-top:4px; }
    .badge-used { background:#ff4d4d22; color:#ff4d4d; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; }
    .badge-active { background:#22c55e22; color:#22c55e; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; }
    .badge-expired { background:#f59e0b22; color:#f59e0b; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; }
    .gen-form { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:24px; margin-bottom:28px; }
    .gen-row { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; }
    .copy-btn { background:transparent; border:1px solid var(--border); color:var(--text-muted); padding:6px 12px; border-radius:8px; cursor:pointer; font-size:12px; transition:all 0.2s; }
    .copy-btn:hover { border-color:var(--accent); color:var(--accent); }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">Moizze <span style="font-size:11px;color:var(--text-dim);font-weight:400">Admin</span></div>
    </div>
    <nav class="sidebar-nav">
      <a href="/admin/dashboard.html" class="nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>Dashboard</a>
      <a href="/admin/users.html" class="nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>Manage Users</a>
      <a href="/admin/withdrawals.html" class="nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>Withdrawals</a>
      <a href="/admin/invite-codes.html" class="nav-item active"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>Invite Codes</a>
      <a href="/dashboard.html" class="nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>My Dashboard</a>
      <a href="#" class="nav-item" data-action="logout"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>Sign Out</a>
    </nav>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <main class="main-content">
    <div class="page-header">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <div>
        <h1 class="page-title">Invite Codes</h1>
        <p class="page-subtitle">Generate and manage signup invitation codes</p>
      </div>
      <div class="header-actions">
        <div class="user-avatar" id="headerAvatar"></div>
      </div>
    </div>

    <!-- Generate Form -->
    <div class="gen-form">
      <h3 style="margin-bottom:16px;font-size:16px">Generate New Codes</h3>
      <div class="gen-row">
        <div class="form-group" style="margin:0;flex:0 0 120px">
          <label class="form-label">How many</label>
          <input type="number" id="genCount" class="form-control" value="1" min="1" max="50">
        </div>
        <div class="form-group" style="margin:0;flex:0 0 160px">
          <label class="form-label">Expires in (days)</label>
          <input type="number" id="genExpiry" class="form-control" placeholder="Never" min="1">
        </div>
        <button class="btn btn-primary" id="generateBtn" onclick="generateCodes()">Generate</button>
      </div>
    </div>

    <!-- New codes result -->
    <div id="newCodesResult" style="display:none;margin-bottom:24px">
      <div style="background:#22c55e11;border:1px solid #22c55e33;border-radius:12px;padding:20px">
        <div style="font-weight:700;color:#22c55e;margin-bottom:12px">✅ New codes generated — share these with users:</div>
        <div id="newCodesList"></div>
      </div>
    </div>

    <!-- All codes -->
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <h2 style="font-size:18px;font-weight:700">All Invite Codes</h2>
        <button class="btn btn-ghost" onclick="loadCodes()" style="font-size:13px">↻ Refresh</button>
      </div>
      <div id="codesContainer"><div style="text-align:center;padding:40px;color:var(--text-dim)">Loading...</div></div>
    </div>
  </main>
</div>

<script src="/js/app.js"></script>
<script>
Auth.requireAdmin();

async function generateCodes() {
  const btn = document.getElementById('generateBtn');
  setLoading(btn, true);
  const count = parseInt(document.getElementById('genCount').value) || 1;
  const expiry = document.getElementById('genExpiry').value;

  const payload = { count };
  if (expiry) payload.expires_days = parseInt(expiry);

  try {
    const res = await api.post('/admin/invite-codes/generate', payload);
    if (res && res.success) {
      const list = document.getElementById('newCodesList');
      list.innerHTML = res.codes.map(c => `
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
          <span style="font-family:monospace;font-size:16px;font-weight:700;letter-spacing:3px;color:var(--accent)">${c.code}</span>
          <button class="copy-btn" onclick="copyCode('${c.code}', this)">Copy</button>
        </div>
      `).join('');
      document.getElementById('newCodesResult').style.display = 'block';
      showToast(`${res.codes.length} code(s) generated!`, 'success');
      loadCodes();
    } else {
      showToast(res?.message || 'Failed to generate', 'error');
    }
  } catch (e) {
    showToast('Error generating codes', 'error');
  } finally {
    setLoading(btn, false);
  }
}

function copyCode(code, btn) {
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 2000);
  });
}

async function loadCodes() {
  try {
    const res = await api.get('/admin/invite-codes');
    const container = document.getElementById('codesContainer');
    if (!res || !res.success || res.codes.length === 0) {
      container.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text-dim)">No invite codes yet. Generate some above.</div>`;
      return;
    }

    container.innerHTML = res.codes.map(c => {
      const isExpired = c.expires_at && new Date(c.expires_at) < new Date();
      const badge = c.is_used
        ? `<span class="badge-used">USED</span>`
        : isExpired
          ? `<span class="badge-expired">EXPIRED</span>`
          : `<span class="badge-active">ACTIVE</span>`;

      const meta = c.is_used
        ? `Used by ${c.used_by_name || 'unknown'} (${c.used_by_email || ''}) on ${formatDate(c.used_at)}`
        : c.expires_at
          ? `Expires: ${formatDate(c.expires_at)}`
          : `No expiry`;

      return `
        <div class="code-card">
          <div>
            <div class="code-text">${c.code}</div>
            <div class="code-meta">${meta}</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            ${badge}
            ${!c.is_used ? `<button class="copy-btn" onclick="copyCode('${c.code}', this)">Copy</button>` : ''}
          </div>
        </div>
      `;
    }).join('');
  } catch (e) {
    document.getElementById('codesContainer').innerHTML = `<div style="color:var(--danger);padding:20px">Failed to load codes.</div>`;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  loadCodes();
});
</script>
</body>
</html>
