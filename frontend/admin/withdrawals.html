<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Withdrawals — Moizze Admin</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <style>
    .filter-tabs { display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap; }
    .filter-tab { padding:8px 20px; border-radius:20px; border:1px solid var(--border); background:transparent; color:var(--text-muted); cursor:pointer; font-size:14px; transition:all 0.2s; }
    .filter-tab.active { background:var(--primary); color:#fff; border-color:var(--primary); }
    .wd-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:16px; }
    .wd-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
    .wd-amount { font-size:24px; font-weight:700; color:var(--danger); }
    .wd-meta { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:16px; font-size:13px; color:var(--text-muted); }
    .wd-meta span { font-weight:600; color:var(--text); }
    .wd-actions { display:flex; gap:10px; }
    .reject-form { margin-top:12px; display:none; }
    .reject-form.active { display:block; }
    .empty-state { text-align:center; padding:60px 20px; color:var(--text-muted); }
    .empty-icon { font-size:48px; margin-bottom:16px; }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">M</div>
      <span>Moizze Admin</span>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item"><span class="nav-icon">📊</span><span>Dashboard</span></a>
      <a href="users.html" class="nav-item"><span class="nav-icon">👥</span><span>Users</span></a>
      <a href="withdrawals.html" class="nav-item active"><span class="nav-icon">💸</span><span>Withdrawals</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-mini" id="adminMini"></div>
      <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="top-bar">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <h1 class="page-title">Withdrawal Requests</h1>
    </div>

    <div class="filter-tabs">
      <button class="filter-tab active" onclick="setFilter('pending', this)">⏳ Pending</button>
      <button class="filter-tab" onclick="setFilter('approved', this)">✅ Approved</button>
      <button class="filter-tab" onclick="setFilter('rejected', this)">❌ Rejected</button>
      <button class="filter-tab" onclick="setFilter('all', this)">📋 All</button>
    </div>

    <div id="wdContainer">
      <div style="text-align:center;padding:60px;color:var(--text-muted)">Loading...</div>
    </div>
  </main>
</div>

<div id="toast" class="toast"></div>

<script src="../js/app.js"></script>
<script>
  requireAdmin();
  let currentFilter = 'pending';

  const adminMini = document.getElementById('adminMini');
  const user = getUser();
  if (user) adminMini.innerHTML = `<strong>${escapeHtml(user.full_name)}</strong><br><small>${escapeHtml(user.email)}</small>`;

  async function loadWithdrawals() {
    const container = document.getElementById('wdContainer');
    container.innerHTML = '<div style="text-align:center;padding:60px;color:var(--text-muted)">Loading...</div>';
    const query = currentFilter === 'all' ? '' : `?status=${currentFilter}`;
    const res = await apiRequest(`/api/admin/withdrawals${query}`);
    if (!res.withdrawals) { container.innerHTML = '<div class="empty-state"><p>Failed to load</p></div>'; return; }
    if (!res.withdrawals.length) {
      container.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><p>No ${currentFilter} withdrawal requests</p></div>`;
      return;
    }
    container.innerHTML = res.withdrawals.map(w => `
      <div class="wd-card" id="wd-${w.id}">
        <div class="wd-header">
          <div>
            <div class="wd-amount">V ${formatNumber(w.amount)}</div>
            <div style="font-size:13px;color:var(--text-muted);margin-top:4px">Ref: ${w.id}</div>
          </div>
          <span class="badge ${w.status === 'pending' ? 'badge-warning' : w.status === 'approved' ? 'badge-success' : 'badge-danger'}">
            ${w.status.charAt(0).toUpperCase() + w.status.slice(1)}
          </span>
        </div>
        <div class="wd-meta">
          <div>User: <span>${escapeHtml(w.user_name)}</span></div>
          <div>Email: <span>${escapeHtml(w.user_email)}</span></div>
          <div>Bank: <span>${escapeHtml(w.bank_name)}</span></div>
          <div>Account: <span class="font-mono">${escapeHtml(w.account_number)}</span></div>
          <div>Account Name: <span>${escapeHtml(w.account_name)}</span></div>
          <div>Requested: <span>${formatDate(w.created_at)}</span></div>
          ${w.admin_note ? `<div>Note: <span>${escapeHtml(w.admin_note)}</span></div>` : ''}
        </div>
        ${w.status === 'pending' ? `
        <div class="wd-actions">
          <button class="btn btn-success btn-sm" onclick="approveWithdrawal(${w.id})">✅ Approve</button>
          <button class="btn btn-outline btn-sm" onclick="toggleRejectForm(${w.id})">❌ Reject</button>
        </div>
        <div class="reject-form" id="rejectForm-${w.id}">
          <div class="form-group" style="margin-top:12px">
            <input type="text" class="form-input" id="rejectNote-${w.id}" placeholder="Reason for rejection (optional)"/>
          </div>
          <button class="btn btn-danger btn-sm" onclick="rejectWithdrawal(${w.id})">Confirm Rejection</button>
        </div>
        ` : ''}
      </div>
    `).join('');
  }

  function setFilter(filter, el) {
    currentFilter = filter;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    loadWithdrawals();
  }

  function toggleRejectForm(id) {
    const form = document.getElementById(`rejectForm-${id}`);
    form.classList.toggle('active');
  }

  async function approveWithdrawal(id) {
    if (!confirm('Approve this withdrawal? Make sure you have sent the money to the user.')) return;
    const res = await apiRequest(`/api/admin/withdrawals/${id}/approve`, 'PUT');
    if (res.message) {
      showToast('Withdrawal approved!', 'success');
      loadWithdrawals();
    } else {
      showToast(res.error || 'Failed to approve', 'error');
    }
  }

  async function rejectWithdrawal(id) {
    const note = document.getElementById(`rejectNote-${id}`).value;
    const res = await apiRequest(`/api/admin/withdrawals/${id}/reject`, 'PUT', { admin_note: note });
    if (res.message) {
      showToast('Withdrawal rejected. Vouch refunded to user.', 'success');
      loadWithdrawals();
    } else {
      showToast(res.error || 'Failed to reject', 'error');
    }
  }

  function formatNumber(n) { return parseFloat(n).toLocaleString('en-US', { minimumFractionDigits: 2 }); }
  function formatDate(d) { return new Date(d).toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }); }

  loadWithdrawals();
</script>
</body>
</html>
